name: Outpost package

on:
  push:
    tags: ['outpost-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run package
      - run: npm run test-unit -- out-esbuild/common/input/Keyboard.test.js
      - run: npm run lint
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: xterm-package
          path: xterm-xterm-*.tgz
          if-no-files-found: error
      - name: Publish the tagged package
        if: startsWith(github.ref, 'refs/tags/outpost-')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" xterm-xterm-*.tgz
          --verify-tag --title "$RELEASE_TAG"
          --notes 'xterm.js 6.0.0 with the upstream Ctrl+/ fix (xtermjs/xterm.js#5515) and regression coverage. Package version 6.0.1 is distributed only through this fork.'
